name: Paired ARM64 benchmark

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - brotli
          - cpython
          - all
      repetitions:
        description: Timed repetitions per fresh VM
        required: true
        default: "1"
        type: string
      trial_class:
        description: Pilot observations are retained but excluded from headline analysis
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - retained

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.workload }} / ${{ matrix.treatment.name }}
    runs-on: ${{ matrix.treatment.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        treatment:
          - name: x64-qemu
            runner: ubuntu-24.04
            host_arch: amd64
          - name: arm64-native
            runner: ubuntu-24.04-arm
            host_arch: arm64
        workload: ${{ fromJSON(inputs.workload == 'all' && '["brotli","cpython"]' || format('["{0}"]', inputs.workload)) }}
    env:
      TARGET_PLATFORM: linux/arm64
      RESULT_FILE: results/${{ matrix.workload }}-${{ matrix.treatment.name }}.jsonl
      REPETITIONS: ${{ inputs.repetitions }}
      TRIAL_CLASS: ${{ inputs.trial_class }}
      BENCH_WORKLOAD: ${{ matrix.workload }}
      BENCH_RUNNER_LABEL: ${{ matrix.treatment.runner }}
      BENCH_HOST_ARCH: ${{ matrix.treatment.host_arch }}

    steps:
      - name: Record treatment intent and start end-to-end job timer
        id: attempt
        shell: bash
        run: |
          set -euo pipefail
          date +%s%N > "${RUNNER_TEMP}/benchmark-job-start-ns"
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > "${RUNNER_TEMP}/benchmark-job-started-at"
          python3 - > "${RUNNER_TEMP}/benchmark-attempt.jsonl" <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          try:
              expected_repetitions = int(os.environ["REPETITIONS"])
              if expected_repetitions < 1:
                  expected_repetitions = 1
          except ValueError:
              expected_repetitions = 1
          host_arch = os.environ["BENCH_HOST_ARCH"]
          record = {
              "schema_version": 2,
              "block_id": "{}.{}".format(
                  os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
              ),
              "workload": os.environ["BENCH_WORKLOAD"],
              "phase": "attempt",
              "repetition": 1,
              "expected_repetitions": expected_repetitions,
              "trial_class": os.environ["TRIAL_CLASS"],
              "runner_label": os.environ["BENCH_RUNNER_LABEL"],
              "host_arch": host_arch,
              "target_arch": "arm64",
              "execution_mode": "native" if host_arch == "arm64" else "emulated",
              "started_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "elapsed_seconds": 0.0,
              "exit_code": 0,
              "command": [],
              "git_sha": os.environ.get("GITHUB_SHA", ""),
              "runner_image_os": os.environ.get("ImageOS", ""),
              "runner_image_version": os.environ.get("ImageVersion", ""),
          }
          print(json.dumps(record, sort_keys=True, separators=(",", ":")))
          PY

      - name: Check out the benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and capture host metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${REPETITIONS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "repetitions must be a positive integer" >&2
            exit 2
          fi
          test "$(nproc)" -eq 4
          expected_uname=x86_64
          if [[ "${{ matrix.treatment.host_arch }}" == arm64 ]]; then
            expected_uname=aarch64
          fi
          test "$(uname -m)" = "${expected_uname}"
          mkdir -p metadata results
          cp "${RUNNER_TEMP}/benchmark-job-start-ns" metadata/job-start-ns.txt
          cp "${RUNNER_TEMP}/benchmark-job-started-at" metadata/job-started-at.txt
          uname -a > metadata/uname.txt
          lscpu -J > metadata/lscpu.json
          cat /proc/cpuinfo > metadata/cpuinfo.txt
          free -b > metadata/memory.txt
          df -B1 > metadata/storage.txt
          {
            printf 'runner_label=%s\n' '${{ matrix.treatment.runner }}'
            printf 'treatment=%s\n' '${{ matrix.treatment.name }}'
            printf 'target_platform=%s\n' "${TARGET_PLATFORM}"
            printf 'image_os=%s\n' "${ImageOS:-}"
            printf 'image_version=%s\n' "${ImageVersion:-}"
            printf 'workflow_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'workflow_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'git_sha=%s\n' "${GITHUB_SHA}"
          } > metadata/runner.txt
          docker version > metadata/docker-version.txt

      - name: Set up QEMU for ARM64 target execution
        id: qemu
        if: matrix.treatment.name == 'x64-qemu'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          version: v0.37.0
          driver-opts: |
            image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Verify target execution and capture tool metadata
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version | tee metadata/buildx-version.txt
          docker buildx inspect '${{ steps.buildx.outputs.name }}' --bootstrap | tee metadata/buildx-inspect.txt
          target_uname=$(docker run --rm --platform "${TARGET_PLATFORM}" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce uname -m)
          test "${target_uname}" = aarch64
          printf '%s\n' "${target_uname}" > metadata/target-uname.txt
          if [[ '${{ matrix.treatment.name }}' == x64-qemu ]]; then
            test -f /proc/sys/fs/binfmt_misc/qemu-aarch64
            grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
            cp /proc/sys/fs/binfmt_misc/qemu-aarch64 metadata/qemu-aarch64-binfmt.txt
          fi
          date +%s%N > metadata/setup-complete-ns.txt

      - name: Measure target execution smoke test
        if: matrix.workload == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measure.py \
            --output "${RESULT_FILE}" \
            --workload smoke \
            --phase target-execution \
            --repetition 1 \
            --expected-repetitions 1 \
            --trial-class "${TRIAL_CLASS}" \
            --runner-label '${{ matrix.treatment.runner }}' \
            --host-arch '${{ matrix.treatment.host_arch }}' \
            --target-arch arm64 \
            -- docker run --rm --platform "${TARGET_PLATFORM}" \
              alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
              sh -c 'test "$(uname -m)" = aarch64 && dd if=/dev/zero bs=1M count=64 2>/dev/null | sha256sum'

      - name: Fetch and verify the pinned source fixture
        id: fetch
        if: matrix.workload != 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measure.py \
            --output "${RESULT_FILE}" \
            --workload '${{ matrix.workload }}' \
            --phase fetch \
            --repetition 1 \
            --expected-repetitions 1 \
            --trial-class "${TRIAL_CLASS}" \
            --runner-label '${{ matrix.treatment.runner }}' \
            --host-arch '${{ matrix.treatment.host_arch }}' \
            --target-arch arm64 \
            -- python3 scripts/fetch_fixture.py '${{ matrix.workload }}' 'workloads/${{ matrix.workload }}'
          fixture_path=$(python3 scripts/fetch_fixture.py '${{ matrix.workload }}' 'workloads/${{ matrix.workload }}')
          printf '%s\n' "${fixture_path}"
          sha256sum "${fixture_path}" > metadata/fixture-sha256.txt

      - name: Prepare pinned target-platform base and source layers
        if: matrix.workload != 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measure.py \
            --output "${RESULT_FILE}" \
            --workload '${{ matrix.workload }}' \
            --phase prepare \
            --repetition 1 \
            --expected-repetitions 1 \
            --trial-class "${TRIAL_CLASS}" \
            --runner-label '${{ matrix.treatment.runner }}' \
            --host-arch '${{ matrix.treatment.host_arch }}' \
            --target-arch arm64 \
            -- docker buildx build \
              --builder '${{ steps.buildx.outputs.name }}' \
              --platform "${TARGET_PLATFORM}" \
              --target prepared \
              --provenance=false \
              --sbom=false \
              --output type=cacheonly \
              --progress plain \
              'workloads/${{ matrix.workload }}'

      - name: Measure compile, native tests, and compression
        id: measure
        if: matrix.workload != 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          for repetition in $(seq 1 "${REPETITIONS}"); do
            python3 scripts/measure.py \
              --output "${RESULT_FILE}" \
              --workload '${{ matrix.workload }}' \
              --phase build-test \
              --repetition "${repetition}" \
              --expected-repetitions "${REPETITIONS}" \
              --trial-class "${TRIAL_CLASS}" \
              --runner-label '${{ matrix.treatment.runner }}' \
              --host-arch '${{ matrix.treatment.host_arch }}' \
              --target-arch arm64 \
              -- docker buildx build \
                --builder '${{ steps.buildx.outputs.name }}' \
                --platform "${TARGET_PLATFORM}" \
                --target benchmark \
                --build-arg "BENCHMARK_ITERATION=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${repetition}" \
                --provenance=false \
                --sbom=false \
                --output type=cacheonly \
                --progress plain \
                'workloads/${{ matrix.workload }}'
          done

      - name: Export cached correctness evidence
        id: evidence
        if: matrix.workload != 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'evidence/${{ matrix.workload }}'
          docker buildx build \
            --builder '${{ steps.buildx.outputs.name }}' \
            --platform "${TARGET_PLATFORM}" \
            --target evidence \
            --build-arg "BENCHMARK_ITERATION=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REPETITIONS}" \
            --provenance=false \
            --sbom=false \
            --output type=local,dest='evidence/${{ matrix.workload }}' \
            --progress plain \
            'workloads/${{ matrix.workload }}'

      - name: Finalize job and tool evidence
        id: finalize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata results evidence
          if [[ -f "${RUNNER_TEMP}/benchmark-attempt.jsonl" ]]; then
            cp "${RUNNER_TEMP}/benchmark-attempt.jsonl" \
              "results/attempt-${BENCH_WORKLOAD}-${{ matrix.treatment.name }}.jsonl"
          fi
          end_ns=$(date +%s%N)
          printf '%s\n' "${end_ns}" > metadata/job-end-ns.txt
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > metadata/job-ended-at.txt
          start_ns=$(cat "${RUNNER_TEMP}/benchmark-job-start-ns")
          python3 - "${start_ns}" "${end_ns}" > metadata/job-elapsed-seconds.txt <<'PY'
          import sys
          print((int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000)
          PY
          if [[ '${{ matrix.treatment.name }}' == x64-qemu ]] && command -v docker >/dev/null; then
            docker run --rm \
              docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
              --version > metadata/binfmt-version.txt 2>&1 \
              || printf '%s\n' 'binfmt version command unavailable' > metadata/binfmt-version.txt
          else
            printf '%s\n' 'not used for native ARM64 treatment' > metadata/binfmt-version.txt
          fi

      - name: Upload raw measurements and metadata
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.workload }}-${{ matrix.treatment.name }}-${{ github.run_attempt }}
          path: |
            results/
            metadata/
            evidence/
          if-no-files-found: error
          retention-days: 30
